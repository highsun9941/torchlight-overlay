name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo test --release --locked --workspace
        working-directory: vorax
  windows:
    name: Windows helper and package
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_HOME: ${{ github.workspace }}/.toolchain/cargo
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - name: Native regression tests
        run: cargo test --release --locked --workspace --manifest-path vorax/Cargo.toml
      - name: Render moving Korean title crops for visual verification
        env:
          VORAX_QA_CROPS: 1
        run: cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay moving_title_rows_keep_dense_hangul_and_follow_each_card_independently -- --nocapture --test-threads=1
      - name: Render the reported failure banner and counter location
        env:
          VORAX_QA_CROPS: 1
        run: cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay reported_counter_failure_is_visible_with_no_actionable_advice -- --nocapture --test-threads=1
      - name: Render the wrapped species OCR input
        env:
          VORAX_QA_CROPS: 1
        run: cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay the_species_text_crop_preserves_the_wrapped_title_and_description -- --nocapture --test-threads=1
      - name: Render the gold instrument heading
        env:
          VORAX_QA_CROPS: 1
        run: cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay a_gold_tooltip_uses_all_four_edges_and_preserves_the_short_title -- --nocapture --test-threads=1
      - name: Prepare Korean OCR capability on the temporary test runner
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        timeout-minutes: 5
        continue-on-error: true
        run: |
          try {
            $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -Like 'Language.OCR*ko-KR*' }
            if (!$cap) { Write-Host 'KOREAN_OCR_SETUP_UNAVAILABLE: the runner does not offer this capability'; exit 0 }
            Write-Host ($cap | Format-List | Out-String)
            if ($cap.State -ne 'Installed') { $cap | Add-WindowsCapability -Online -ErrorAction Stop | Out-Host }
          } catch {
            Write-Host "KOREAN_OCR_SETUP_UNAVAILABLE: $($_.Exception.Message)"
          }
      - name: Exercise real Korean Windows OCR when the OS capability is present
        shell: powershell
        run: |
          try {
            $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
            $null = [Windows.Globalization.Language, Windows.Globalization, ContentType = WindowsRuntime]
            $lang = [Windows.Globalization.Language]::new('ko-KR')
            $supported = [Windows.Media.Ocr.OcrEngine]::IsLanguageSupported($lang)
          } catch {
            Write-Host "KOREAN_OCR_INTEGRATION_UNAVAILABLE: $($_.Exception.Message)"
            exit 0
          }
          if (!$supported) {
            Write-Host 'KOREAN_OCR_INTEGRATION_UNAVAILABLE: OS language capability is not installed; no runtime claim is made.'
            exit 0
          }
          cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay native_windows_korean_ocr_reads_reported_tooltip -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Korean OCR integration failed' }
      - name: Tartarus regression tests
        run: dotnet test tartarus/tests/Tartarus.Rules.Tests/Tartarus.Rules.Tests.csproj -c Release -p:Platform=x64 --logger trx
      - name: Build portable Windows helper
        run: ./build.ps1
      - name: Read reported cards with the actual Korean CPU model
        id: ocr_validation
        env:
          VORAX_LANGUAGE: ko
          VORAX_OCR_MODE: accurate
          VORAX_OCR_BACKEND: paddle
          VORAX_OCR_THREADS: 2
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'paddle-ocr-validation'
          $fixtures = (Resolve-Path 'vorax/fixtures').Path
          $args = '--ocr-validate "' + $fixtures + '" "' + $out + '"'
          $process = Start-Process ./release/TorchlightHelper-KO/vorax-overlay.exe -ArgumentList $args -Wait -PassThru
          $report = Join-Path $out 'model-validation.json'
          if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Actual Korean PaddleOCR validation failed' }
      - name: Measure one and two CPU threads without OCR result caching
        if: always() && steps.ocr_validation.outcome != 'skipped'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'paddle-ocr-validation'
          if (!(Test-Path $out)) { exit 0 }
          foreach ($threads in 1,2) {
            $json = & ./release/TorchlightHelper-KO/Vorax.OcrHost.exe --benchmark $out --threads $threads
            if ($LASTEXITCODE -ne 0) { throw 'CPU OCR benchmark failed' }
            $json | Set-Content (Join-Path $out "benchmark-$threads.json") -Encoding utf8
            $result = $json | ConvertFrom-Json
            $warm = @($result.records | ForEach-Object { $_.readings | Select-Object -Skip 1 | ForEach-Object { $_.InferenceMs } }) | Sort-Object
            if ($warm.Count) { Write-Host "PADDLE_CPU threads=$threads warm_median_ms=$($warm[[int]($warm.Count/2)]) working_set_bytes=$($result.workingSetBytes)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.ocr_validation.outcome != 'skipped'
        with:
          name: Korean-CPU-OCR-validation
          path: ${{ runner.temp }}/paddle-ocr-validation/
          if-no-files-found: warn
      - name: Verify production reader on Korean screenshots
        env:
          VORAX_LANGUAGE: ko
          VORAX_OCR_MODE: accurate
        shell: pwsh
        run: |
          foreach ($image in Get-ChildItem vorax/fixtures/korean/*.png) {
            $out = Join-Path $env:RUNNER_TEMP $image.BaseName
            $args = '--inspect "' + $image.FullName + '" "' + $out + '"'
            $process = Start-Process ./release/TorchlightHelper-KO/vorax-overlay.exe -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Diagnostic failed: $($image.Name)" }
            $result = Get-Content (Join-Path $out reading.json) -Raw | ConvertFrom-Json
            if ($result.outcome -ne 'advice') { throw "$($image.Name): $($result | ConvertTo-Json -Depth 12 -Compress)" }
          }
      - name: Verify helper window and maximum performance selection
        shell: pwsh
        run: |
          $data = 'release/TorchlightHelper-KO/user-data/tartarus'
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"VoraxCpuMode":3,"ShelleyLevel":0,"SettingsVersion":2}' | Set-Content "$data/settings.json"
          $preview = Join-Path $env:RUNNER_TEMP 'helper-ui'
          $process = Start-Process ./release/TorchlightHelper-KO/TorchlightHelper.exe -ArgumentList "--preview-ui $preview" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$preview/vorax-ui.png")) { throw 'Helper UI preview failed' }
      - name: Package and verify file hashes
        run: python package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TorchlightHelper-1.2.8-ocr.1-win-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
  release:
    name: Publish verified OCR branch preview
    if: github.event_name == 'pull_request' && github.head_ref == 'hf-korean-ocr-cpu' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [rust, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: TorchlightHelper-1.2.8-ocr.1-win-x64
          path: release
      - name: Publish release after both test suites pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.8-ocr.1 >/dev/null 2>&1; then
            gh release create v1.2.8-ocr.1 release/*.zip release/*.sha256 --target "${{ github.event.pull_request.head.sha }}" --prerelease --latest=false --title "Torchlight Helper 1.2.8-ocr.1 — 한국어 CPU OCR 실험판" --notes-file RELEASE_NOTES.md
          fi
