name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo test --release --locked --workspace
        working-directory: vorax
  windows:
    name: Windows helper and package
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_HOME: ${{ github.workspace }}/.toolchain/cargo
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - name: Native regression tests
        run: cargo test --release --locked --workspace --manifest-path vorax/Cargo.toml
      - name: Render moving Korean title crops for visual verification
        env:
          VORAX_QA_CROPS: 1
        run: cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay moving_title_rows_keep_dense_hangul_and_follow_each_card_independently -- --nocapture --test-threads=1
      - name: Prepare Korean OCR capability on the temporary test runner
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        timeout-minutes: 5
        continue-on-error: true
        run: |
          try {
            $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -Like 'Language.OCR*ko-KR*' }
            if (!$cap) { Write-Host 'KOREAN_OCR_SETUP_UNAVAILABLE: the runner does not offer this capability'; exit 0 }
            Write-Host ($cap | Format-List | Out-String)
            if ($cap.State -ne 'Installed') { $cap | Add-WindowsCapability -Online -ErrorAction Stop | Out-Host }
          } catch {
            Write-Host "KOREAN_OCR_SETUP_UNAVAILABLE: $($_.Exception.Message)"
          }
      - name: Exercise real Korean Windows OCR when the OS capability is present
        shell: powershell
        run: |
          try {
            $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
            $null = [Windows.Globalization.Language, Windows.Globalization, ContentType = WindowsRuntime]
            $lang = [Windows.Globalization.Language]::new('ko-KR')
            $supported = [Windows.Media.Ocr.OcrEngine]::IsLanguageSupported($lang)
          } catch {
            Write-Host "KOREAN_OCR_INTEGRATION_UNAVAILABLE: $($_.Exception.Message)"
            exit 0
          }
          if (!$supported) {
            Write-Host 'KOREAN_OCR_INTEGRATION_UNAVAILABLE: OS language capability is not installed; no runtime claim is made.'
            exit 0
          }
          cargo test --release --locked --manifest-path vorax/Cargo.toml -p vorax-overlay native_windows_korean_ocr_reads_reported_tooltip -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Korean OCR integration failed' }
      - name: Tartarus regression tests
        run: dotnet test tartarus/tests/Tartarus.Rules.Tests/Tartarus.Rules.Tests.csproj -c Release -p:Platform=x64 --logger trx
      - name: Build portable Windows helper
        run: ./build.ps1
      - name: Verify production reader on Korean screenshots
        env:
          VORAX_LANGUAGE: ko
          VORAX_OCR_MODE: accurate
        shell: pwsh
        run: |
          foreach ($image in Get-ChildItem vorax/fixtures/korean/*.png) {
            $out = Join-Path $env:RUNNER_TEMP $image.BaseName
            $args = '--inspect "' + $image.FullName + '" "' + $out + '"'
            $process = Start-Process ./release/TorchlightHelper-KO/vorax-overlay.exe -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Diagnostic failed: $($image.Name)" }
            $result = Get-Content (Join-Path $out reading.json) -Raw | ConvertFrom-Json
            if ($result.outcome -ne 'advice') { throw "$($image.Name): $($result | ConvertTo-Json -Depth 12 -Compress)" }
          }
      - name: Verify helper window and maximum performance selection
        shell: pwsh
        run: |
          $data = 'release/TorchlightHelper-KO/user-data/tartarus'
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"VoraxCpuMode":3,"ShelleyLevel":0,"SettingsVersion":2}' | Set-Content "$data/settings.json"
          $preview = Join-Path $env:RUNNER_TEMP 'helper-ui'
          $process = Start-Process ./release/TorchlightHelper-KO/TorchlightHelper.exe -ArgumentList "--preview-ui $preview" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$preview/vorax-ui.png")) { throw 'Helper UI preview failed' }
      - name: Package and verify file hashes
        run: python package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TorchlightHelper-1.2.3-win-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
  release:
    name: Publish verified Windows download
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [rust, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: TorchlightHelper-1.2.3-win-x64
          path: release
      - name: Publish release after both test suites pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.3 >/dev/null 2>&1; then
            gh release create v1.2.3 release/*.zip release/*.sha256 --target "$GITHUB_SHA" --title "Torchlight Helper 1.2.3 — OCR 개선" --notes-file RELEASE_NOTES.md
          fi
