name: Import upstream source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-upstream.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Import pinned MIT source and assets
        env:
          UPSTREAM_COMMIT: ddac4bfce7fe7551351d5cac7d8ef35096b2100d
        run: |
          git clone --quiet https://github.com/kinam-ssafy/torchlight-overlay.git "$RUNNER_TEMP/torchlight-upstream"
          git -C "$RUNNER_TEMP/torchlight-upstream" checkout --quiet --detach "$UPSTREAM_COMMIT"
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "torchlight-upstream"
          target = Path.cwd()
          for path in source.iterdir():
              if path.name == ".git":
                  continue
              dest = target / path.name
              if path.is_dir():
                  shutil.copytree(path, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(path, dest)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Import MIT upstream source at $UPSTREAM_COMMIT"
            git push origin HEAD:main
          fi
